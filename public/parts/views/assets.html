      <div class="view hidden" id="view-assets">
        <div class="page-header page-header--assets">
          <h1>Varlıklar</h1>
          <span class="count-chip" id="assetCount">Yükleniyor...</span>
          <div class="ph-actions">
            <button class="btn-add" id="openAddModal">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Yeni Varlık Ekle
            </button>
            <div style="position:relative">
              <button class="btn-icon" id="assetsMoreBtn" title="Diğer işlemler" aria-label="Diğer işlemler">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
              </button>
              <div class="tb-menu tb-menu--right" id="assetsMoreMenu">
                <button id="exportCsvBtn">Excel / CSV olarak indir</button>
                <button id="bulkStockBtn">Toplu depo kaydı</button>
                <button id="assetsRefreshBtn">Listeyi yenile</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Durum kartları — tasarımda filtre çubuğunun ÜSTÜNDE -->
        <div class="mini-stats" id="miniStats"></div>

        <div class="assets-layout">
        <div class="assets-main">
        <!-- Filtre çubuğu -->
        <div class="filter-bar">
          <div class="fb-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="assetSearch" placeholder="Varlık ara..." />
          </div>
          <select id="filterCategory" class="select-sm fb-sel">
            <option value="">Tüm Kategoriler</option>
          </select>
          <select id="filterLocation" class="select-sm fb-sel">
            <option value="">Tüm Lokasyonlar</option>
          </select>
          <select id="filterStatus" class="select-sm fb-sel">
            <option value="">Tüm Durumlar</option>
            <option value="online">Çevrimiçi</option>
            <option value="offline">Çevrimdışı</option>
            <option value="depoda">Depoda</option>
          </select>
          <button class="tb-btn" id="clearFiltersBtn" title="Filtreleri temizle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filtreyi Temizle
          </button>
        </div>

        <!-- Toplu seçim çubuğu -->
        <div class="bulk-bar" id="bulkBar" hidden>
          <span><b id="bulkCount">0</b> varlık seçildi</span>
          <button class="btn-pdf" id="bulkExportBtn">Seçilenleri CSV'ye aktar</button>
          <button class="btn-pdf" id="bulkClearBtn">Seçimi temizle</button>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="asset-table asset-table--v2">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="selectAll" aria-label="Tümünü seç"></th>
                  <th class="sortable" data-sort="serial_number">Varlık Kodu</th>
                  <th class="sortable" data-sort="hostname">Varlık Adı</th>
                  <th class="sortable" data-sort="category">Kategori</th>
                  <th class="sortable" data-sort="location">Lokasyon</th>
                  <th class="sortable" data-sort="status">Durum</th>
                  <th>Sorumlu Kişi</th>
                  <th class="col-actions">İşlemler</th>
                </tr>
              </thead>
              <tbody id="assetsBody">
                <tr><td colspan="8" class="loading-cell">Yükleniyor...</td></tr>
              </tbody>
            </table>
          </div>

          <div class="asset-cards" id="assetCards"></div>

          <div class="cards-foot" id="cardsFoot">
            <button class="load-more" id="loadMoreBtn">
              Daha Fazla Yükle
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <p class="cards-info" id="cardsInfo"></p>
          </div>

          <div class="table-foot">
            <label class="rows-per">
              <select id="rowsPerPage" class="select-sm">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
              satır göster
            </label>
            <nav class="pager" id="assetsPager" aria-label="Sayfalama"></nav>
          </div>
        </div>
        </div><!-- /assets-main -->

        <!-- Geniş ekran bağlam rayı (tasarım referansı) -->
        <aside class="assets-rail">
          <div class="card">
            <div class="card-header">
              <h3>Son Aktiviteler</h3>
              <button class="btn-ghost" data-view="lifecycle">Tümünü Gör</button>
            </div>
            <div class="act-list" id="railActivity"><p class="loading-cell">Yükleniyor...</p></div>
          </div>

          <div class="card card--alert">
            <div class="card-header">
              <h3 style="color:var(--red)">Kritik Uyarılar <span class="count-pill" id="railCritPill">0</span></h3>
              <button class="btn-ghost" data-view="alerts">Tümünü Gör</button>
            </div>
            <div class="sev-body" id="railCrit"></div>
          </div>

          <div class="card card--insight">
            <div class="card-header"><h3>AI Önerisi</h3></div>
            <div class="insight-body">
              <p id="railInsightText">Değerlendiriliyor...</p>
              <button class="btn-add" id="railInsightBtn" style="display:none">İncele</button>
            </div>
          </div>
        </aside>
        </div><!-- /assets-layout -->
      </div>
