      <div class="view hidden" id="view-licenses">
        <div class="page-header">
          <h1>Yazılım Lisansları</h1>
          <p class="page-subtitle" id="licenseCount">Yükleniyor...</p>
        </div>

        <!-- License Stats -->
        <div class="stats-grid" id="licenseStatsGrid">
          <div class="stat-card">
            <div class="stat-icon stat-icon--blue">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Toplam Kayıt</span>
              <span class="stat-value" id="licTotal">—</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--green">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Lisanslı</span>
              <span class="stat-value" id="licLicensed">—</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--red">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Lisanssız</span>
              <span class="stat-value" id="licUnlicensed">—</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--yellow">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Yakında Bitiyor</span>
              <span class="stat-value" id="licExpiring">—</span>
            </div>
          </div>
        </div>

        <!-- License Charts Row -->
        <div class="charts-row">
          <div class="card">
            <div class="card-header"><h3>En Çok Kullanılan Yazılımlar</h3></div>
            <div class="chart-container"><div class="bar-wrap" id="licSoftwareBars"></div></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Lisans Durumu</h3></div>
            <div class="status-rings"><div class="ring-container" id="licStatusRings"></div></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Lisans Tipi</h3></div>
            <div class="chart-container"><div class="bar-wrap" id="licTypeBars"></div></div>
          </div>
        </div>

        <!-- License Table -->
        <div class="card">
          <div class="card-header">
            <h3>Detaylı Lisans Listesi</h3>
            <div class="table-filters">
              <select id="licFilterStatus" class="select-sm">
                <option value="">Tüm Durumlar</option>
                <option value="Licensed">Lisanslı</option>
                <option value="Unlicensed">Lisanssız</option>
                <option value="Unknown">Bilinmiyor</option>
              </select>
              <select id="licFilterType" class="select-sm">
                <option value="">Tüm Tipler</option>
                <option value="ESD">ESD</option>
                <option value="Volume">Volume</option>
                <option value="Subscription">Subscription</option>
                <option value="OEM">OEM</option>
              </select>
              <input type="text" id="licSearch" class="select-sm" placeholder="Yazılım veya bilgisayar ara..." style="width:220px" />
            </div>
          </div>
          <div class="table-wrap">
            <table class="asset-table">
              <thead>
                <tr>
                  <th>Yazılım</th>
                  <th>Versiyon</th>
                  <th>Yayıncı</th>
                  <th>Lisans Tipi</th>
                  <th>Durum</th>
                  <th>Anahtar (son 5)</th>
                  <th>Bilgisayar</th>
                  <th>Kullanıcı</th>
                  <th>Kurulum Tarihi</th>
                  <th>Son Görülme</th>
                </tr>
              </thead>
              <tbody id="licenseBody">
                <tr><td colspan="10" class="loading-cell">Yükleniyor...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
