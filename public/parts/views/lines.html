      <div class="view hidden" id="view-lines">
        <div class="page-header">
          <div class="ph-t">
            <h1>Hatlar &amp; SIM Kartları</h1>
            <p class="page-subtitle">Tüm hatlarınızı ve SIM kartlarınızı yönetin.</p>
          </div>
          <button class="btn-pdf" id="importLinesBtn" data-rol="it,admin" title="CSV ile hat içe aktar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            CSV İçe Aktar
          </button>
          <button class="btn-add" id="openAddLine" data-rol="it,admin">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Hat Ekle
          </button>
          <button class="btn-icon" id="linesMore" title="Dışa aktar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>

        <div class="stats-grid" id="lineStats">
          <div class="stat-card"><div class="stat-icon stat-icon--blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg></div>
            <div class="stat-info"><span class="stat-label">Toplam Hat</span><span class="stat-value" id="lineTotal">—</span><span class="stat-sub">Tüm hatlar</span></div></div>
          <div class="stat-card"><div class="stat-icon stat-icon--green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg></div>
            <div class="stat-info"><span class="stat-label">Telefona Bağlı</span><span class="stat-value" id="lineAssigned">—</span><span class="stat-sub">Aktif hatlar</span></div></div>
          <div class="stat-card"><div class="stat-icon stat-icon--yellow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg></div>
            <div class="stat-info"><span class="stat-label">Boşta</span><span class="stat-value" id="lineUnassigned">—</span><span class="stat-sub">Bağlı olmayan hatlar</span></div></div>
          <div class="stat-card"><div class="stat-icon stat-icon--purple"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.7 2.34"/></svg></div>
            <div class="stat-info"><span class="stat-label">Operatör</span><span class="stat-value" id="lineOperators">—</span><span class="stat-sub">Operatör sayısı</span></div></div>
        </div>

        <!-- Filtreler: hepsi ISTEMCIDE calisir (hat sayisi kucuk, sunucuya
             gitmenin anlami yok). Secenekler veriden turetilir — sabit liste
             yazilsa yeni operator/tarife eklenince gorunmezdi. -->
        <div class="card lines-filters">
          <div class="lf-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="lineSearch" placeholder="Hat, telefon veya SIM numarası ara..." />
          </div>
          <div class="field-sm"><label>Operatör</label><select id="lineFilterOp" class="select-sm"><option value="">Tümü</option></select></div>
          <div class="field-sm"><label>Durum</label><select id="lineFilterStatus" class="select-sm"><option value="">Tümü</option></select></div>
          <div class="field-sm"><label>Tarife</label><select id="lineFilterTariff" class="select-sm"><option value="">Tümü</option></select></div>
          <button class="btn-pdf" id="lineFilterClear">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
            Filtreleri Temizle
          </button>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table class="asset-table lines-table">
              <thead>
                <tr>
                  <th>Telefon No (MSISDN)</th>
                  <th>SIM No (ICCID)</th>
                  <th>Operatör</th>
                  <th>Tarife</th>
                  <th>Durum</th>
                  <th>Bağlı Telefon</th>
                  <th style="text-align:right">İşlemler</th>
                </tr>
              </thead>
              <tbody id="linesBody">
                <tr><td colspan="7" class="loading-cell">Yükleniyor...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="lines-foot">
            <span id="lineRange">—</span>
            <div class="lf-pager">
              <button class="btn-icon" id="linePrev" aria-label="Önceki sayfa">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <span id="linePages"></span>
              <button class="btn-icon" id="lineNext" aria-label="Sonraki sayfa">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <select id="linePageSize" class="select-sm">
                <option value="25" selected>25 / sayfa</option>
                <option value="50">50 / sayfa</option>
                <option value="100">100 / sayfa</option>
              </select>
            </div>
          </div>
        </div>
      </div>
