  <!-- Kullanıcı Sil Onay Modalı (tarayıcı confirm'i yerine) -->
  <div class="modal-overlay" id="userDeleteOverlay">
    <div class="modal um-modal um-modal--sm">
      <div class="um-head">
        <span class="um-ico um-ico--red">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </span>
        <div class="um-htxt">
          <h3>Hesabı Sil</h3>
          <p class="um-desc">Bu işlem geri alınamaz.</p>
        </div>
        <button class="um-x" id="userDeleteClose" type="button" aria-label="Kapat">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="um-body">
        <p class="um-ctxt">Aşağıdaki hesap <b>kalıcı olarak</b> silinecek:</p>
        <div class="um-acct">
          <span class="um-avatar" id="udAvatar">?</span>
          <div>
            <div class="um-acct-nm" id="udName">—</div>
            <div class="um-acct-un" id="udUser">—</div>
          </div>
        </div>
        <div class="um-warn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          Silinen hesap ve denetim izi geri getirilemez.
        </div>
        <p class="um-err" id="udError" hidden></p>
      </div>

      <div class="um-foot">
        <button class="btn-pdf" id="udCancel" type="button">Vazgeç</button>
        <button class="btn-add btn-danger" id="udConfirm" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Kalıcı Olarak Sil
        </button>
      </div>
    </div>
  </div>
